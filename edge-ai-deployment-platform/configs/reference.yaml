deployment_root: var/deployment
registry_root: var/registry
api_key_env: EDGEAI_API_KEY
queue_capacity: 64
queue_policy: reject
max_batch: 128
max_input_features: 4096
max_input_values: 524288
max_output_classes: 4096
max_output_values: 262144
max_request_bytes: 8388608
inference_workers: 1
queue_deadline_s: 1.0
execution_mode: process
execution_timeout_s: 2.0
process_control_timeout_s: 5.0
process_memory_limit_mb: null
process_nofile_limit: 64
process_restart_limit: 8
process_restart_window_s: 60.0
shutdown_timeout_s: 5.0
max_model_uncompressed_bytes: 268435456
isolate_health_gate: true
health_gate_timeout_s: 30.0
health_gate_memory_limit_mb: null
max_validation_rows: 100000
max_validation_features: 1000000
max_validation_values: 10000000
health_benchmark_iterations: 40
health_benchmark_batch: 32
min_accuracy: 0.94
max_accuracy_drop: 0.02
max_ece: 0.20
max_p95_latency_ms: 20.0
max_rss_mb: 1024.0
